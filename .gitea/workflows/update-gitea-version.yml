---
name: Update Gitea Version

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Specific Gitea version to test and tag (e.g. 28.1.0). Leave empty to use latest."
        required: false
        default: ''
  pull_request:
    branches:
      - main

jobs:
  update-version:
    runs-on: fedora-latest
    steps:
      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITEA_PATH"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ansible_role_scm
          fetch-depth: 0

      - name: Bump version
        uses: https://gianet.us/engineering/infra-actions/bump-version@v1
        with:
          repo-path: ansible_role_scm
          var-name: gitea_version
          upstream-repo: go-gitea/gitea
          version: ${{ inputs.version }}
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Notify on failure
        if: failure()
        uses: https://gianet.us/engineering/infra-actions/notify-on-failure@v1
        with:
          server-address: ${{ vars.MAIL_SERVER_ADDRESS }}
          server-port: ${{ vars.MAIL_SERVER_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ vars.MAIL_TO }}
